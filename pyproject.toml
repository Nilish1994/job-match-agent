[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "job-match-agent"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["anthropic==2.8.0", "httpx==0.28.1", "pydantic==2.14.3", "PyYAML==6.0.3", "reportlab==5.1.0", "pypdf==7.1.0",
                "cryptography==50.0.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agent*"]
